[project]
name = "mycelium-http-tools"
version = "0.2.0"
description = "A python library to integrate python APIs in Mycelium API Gateway"
authors = [{ name = "Samuel Galvão Elias", email = "sgelias@outlook.com" }]
license = { text = "Apache 2.0" }
readme = "README.md"
requires-python = ">=3.12,<4.0"

dependencies = ["pydantic (>=2.13.5,<3.0.0)", "urllib3 (>=2.7.0,<3.0.0)"]

[tool.poetry]
packages = [
    { include = "myc_http_tools", from = "src" },
    { include = "tests", from = "src" },
]

[project.optional-dependencies]
dev = ["mypy>=2.3.1", "pre-commit>=4.6.2", "commitizen>=4.18.0"]
fastapi = [
    "fastapi[standard] (>=0.141.1,<1.0.0)",
    "zstandard (>=0.25.0,<0.26.0)",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
commitizen = "^4.18.0"
mypy = "^2.3.1"
pre-commit = "^4.6.2"
pytest = "^9.0.3"
